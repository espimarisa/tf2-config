///////////////////////////////////////////////////////////////////////////////
// Medic config.           											         //
///////////////////////////////////////////////////////////////////////////////

exec reset.cfg

// Uber mask bind on v.
alias randomvoice "random1"
alias random1 "voicemenu 2 1; alias randomvoice random2"
alias random2 "voicemenu 2 2; alias randomvoice random3"
alias random3 "voicemenu 2 3; alias randomvoice random4"
alias random4 "voicemenu 2 4; alias randomvoice random5"
alias random5 "voicemenu 2 5; alias randomvoice random6"
alias random6 "voicemenu 2 6; alias randomvoice random7"
alias random7 "voicemenu 2 7; alias randomvoice random1"
bind v "randomvoice"

// Medic Radar bind on b.
alias +medicradar
alias -medicradar
bind b +medicradar

// Loadout binds.
alias medigun "load_itempreset 0; say_team *** SWAPPED TO UBER JUST WALK FORWARD IDIOT ***; alias announce_pop pop_uber"
alias kritz "load_itempreset 1; say_team *** SWAPPED TO KRITZ PLEASE JUST SHOOT THEM ***; alias announce_pop pop_kritz"
alias quickfix "load_itempreset 2; say_team *** SWAPPED TO QUICK-FIX PLEASE DON'T GET ME KILLED ***; alias announce_pop pop_quickfix"
alias vacc "load_itempreset 3; say_team *** SWAPPED TO VACCINATOR I HATE FUN ***; alias announce_pop pop_vacc"
bind "UPARROW" "medigun"
bind "LEFTARROW" "kritz"
bind "DOWNARROW" "quickfix"
bind "RIGHTARROW" "vacc"

// Uber binds.
alias pop_uber "say_team *** UBER USED! GO DO SOMETHING USEFUL! ***"
alias pop_kritz "say_team *** KRITZ USED! JUST HOLD YOUR W KEY! ***"
alias pop_quickfix "say_team *** QUICK-FIX USED! GO GO GO PLEASE! ***"
alias pop_vacc "say_team *** VACCINATOR USED! DO SOMETHING USEFUL LOLOLOL! ***"
alias announce_pop "pop_uber"
alias +atk2 "+attack2; announce_pop"
alias -atk2 "-attack2"
bind "MOUSE2" "+atk2"
