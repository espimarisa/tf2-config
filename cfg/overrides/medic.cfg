alias pop_vacc "say_team *** USED VAX CHARGE! USED VAX CHARGE! USED VAX CHARGE! USED VAX CHARGE! USED VAX CHARGE! ***" 
alias announce_pop "pop_uber" 
alias +atk2 "+attack2; announce_pop" 
