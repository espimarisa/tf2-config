exec overrides/reset.cfg

echo "*** OVERRIDES: Selected Medic, running overrides. ***"

bind V "voicemenu 2 4" // V: Uber mask with Jeers.
bind B "+radar" // B: Medic radar.
bind MOUSE2 "+atk2" // MOUSE2: Use Uber and announce.
bind UPARROW "medigun" // UP ARROW: Loadout slot 1 (Uber).
bind LEFTARROW "kritz"  // LEFT ARROW: Loadout slot 2 (Kritz).
bind DOWNARROW "quickfix" // DOWN ARROW: Loadout slot 3 (Quick-Fix).
bind RIGHTARROW "vacc" // RIGHT ARROW: Loadout slot 4 (Vaccinator).
alias "+radar" "hud_medicautocallersthreshold 500" // Medic radar; shows all team positions.
alias "-radar" "hud_medicautocallersthreshold 75" // Medic radar; shows all team positions.
alias medigun "load_itempreset 0; say_team *** SWAPPED TO UBER! ***; alias announce_pop pop_uber" // Tell team using Uber.
alias kritz "load_itempreset 1; say_team *** SWAPPED TO KRITZ! ***; alias announce_pop pop_kritz" // Tell team using Kritz.
alias quickfix "load_itempreset 2; say_team *** SWAPPED TO QUICK-FIX! ***; alias announce_pop pop_quickfix" // Tell team using Quick-Fix.
alias vacc "load_itempreset 3; say_team *** SWAPPED TO VACCINATOR! ***; alias announce_pop pop_vacc" // Tell team using Vaccinator.
alias pop_uber "say_team *** USED UBER! USED UBER! USED UBER! USED UBER! USED UBER! USED UBER! ***" // Tell team popping Uber.
alias pop_kritz "say_team *** USED KRITZ! USED KRITZ! USED KRITZ! USED KRITZ! USED KRITZ! USED KRITZ! ***" // Tell team popping Kritz.
alias pop_quickfix "say_team *** USED QUICK-FIX! USED QUICK-FIX! USED QUICK-FIX! USED QUICK-FIX! USED QUICK-FIX! ***" // Tell team popping Quick-Fix.
alias pop_vacc "say_team *** USED VAX CHARGE! USED VAX CHARGE! USED VAX CHARGE! USED VAX CHARGE! USED VAX CHARGE! ***" // Tell team using Vaccinator.
alias announce_pop "pop_uber" // Announce when using.
alias +atk2 "+attack2; announce_pop" // Announce when using.
alias -atk2 "-attack2" // Announce when using.

echo "*** OVERRIDES: Finished running. ***"
