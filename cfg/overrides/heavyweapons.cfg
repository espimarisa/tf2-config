///////////////////////////////////////////////////////////////////////////////
// Heavy config.           													 //
///////////////////////////////////////////////////////////////////////////////

exec reset.cfg

// Sandvich Throw on bottom mouse side button.
alias +throw "slot2; +attack2"
alias -throw "-attack2"
bind MOUSE5 "+throw"

// Sandvich Eat on top mouse side button.
alias +eat "slot2; +attack"
alias -eat "-attack"
bind MOUSE4 "+eat"
