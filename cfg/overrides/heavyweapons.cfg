exec overrides/reset.cfg

echo "*** OVERRIDES: Selected Heavy, running class-specific overrides. ***"

bind MOUSE4 "+throw" // MOUSE4/FORWARD: Throw sandvich.
bind MOUSE5 "+eat" // MOUSE5/BACK: Eat sandvich.
bind v "voicemenu 0 6"; // V: Use the "Yes" voice line for """Masking"" being a fatty (eating).
alias +throw "slot2; +attack2"  // Throw sandvich script.
alias -throw "-attack2" // Throw sandvich script.
alias +eat "slot2; +attack" // Eat sandvich script.
alias -eat "-attack" // Eat sandvich script.

echo "*** OVERRIDES: Finished running. ***"
