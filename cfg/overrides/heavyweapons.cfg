exec reset.cfg

echo "*** OVERRIDES: Selected Heavy. ***"

// MOUSE4: Sandvich throw.
// MOUSE5: Sandvich eat.
// V: Yes! voice line. Helpful to cover up eating.

bind MOUSE4 "+throw"
bind MOUSE5 "+eat"

bind v "voicemenu 0 6" // Yes!

// Sandvich throw script.
alias +throw "slot2; +attack2"
alias -throw "-attack2"

// Sandvich eat script.
alias +eat "slot2; +attack"
alias -eat "-attack"
