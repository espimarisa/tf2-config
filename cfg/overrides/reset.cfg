///////////////////////////////////////////////////////////////////////////////
// Resets class-specific binds and settings to their generic ones.           //
///////////////////////////////////////////////////////////////////////////////

r_drawviewmodel 1 // Enables viewmodels.
viewmodel_fov 75 // Resets viewmodel FOV.
cl_hud_playerclass_use_playermodel 0 // Disables the 3D playermodel.

// Default bind resets.
bind 1 "slot1; next_map_vote 0"
bind 2 "slot2; next_map_vote 1"
bind 3 "slot3; next_map_vote 2"
bind 4 "slot4"
bind 5 "slot5"
bind DOWNARROW "load_itempreset 2;"
bind LEFTARROW "load_itempreset 1;"
bind MOUSE1 +attack
bind MOUSE2 +attack2
bind MOUSE3 +attack3
bind MWHEELDOWN "invnext"
bind MWHEELUP "invprev"
bind RIGHTARROW "load_itempreset 3;"
bind UPARROW "load_itempreset 0;"
unbind MOUSE4
unbind MOUSE5

// Unbinds class-specific binds.
unbind b
unbind t
unbind v
