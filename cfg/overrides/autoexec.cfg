// Keybinding settings.
echo "*** AUTOEXEC: Loading keybindings. ***"
bind W "+mf; dotxhaircolor" // W: Move forward and flash crosshair.
bind A "+ml; dotxhaircolor" // A: Move leftward and flash crosshair.
bind S "+mb; dotxhaircolor" // S: Move backward and flash crosshair.
bind D "+mr; dotxhaircolor" // D: Move rightward and flash crosshair.
bind CTRL "+duck" // CTRL: Crouch/duck.
bind SHIFT "+cjump" // SHIFT: Crouch jump.
bind MOUSE1 "+attack" // MOUSE1: Primary attack.
bind MOUSE2 "+attack2" // MOUSE2: Secondary attack.
bind MOUSE3 "+attack3" // MOUSE3: Tertiary attack.
bind MWHEELUP "invprev" // MOUSEWHEELUP: Previous weapon.
bind MWHEELDOWN "invnext" // MOUSEWHEELDOWN: Next weapon.
bind 1 "slot1; next_map_vote 0" // 1: First item slot. Also votes for the first map in Valve Casual.
bind 2 "slot2; next_map_vote 1" // 2: Second item slot. Also votes for the second map in Valve Casual.
bind 3 "slot3; next_map_vote 2" // 3: Third item slot. Also votes for the third map in Valve Casual.
bind 4 "slot4" // 4: Fourth item slot.
bind 5 "slot5" // 5: Fifth item slot.
bind 8 "say CONFORM NOW --> WWW.CAREERS.WALMART.COM"
bind 9 "say " // +1
bind C "voice_menu_3" // C: Voice Menu 3
bind E "voicemenu 0 0" // E: MEDIC! call.
bind F "+inspect" // F: Inspect.
bind H "+use_action_slot_item" // H: Action item slot (weapon pickups, grappling hooks, canteens).
bind K "cl_trigger_first_notification" // K: Accept/view the first notification (duels, item drops).
bind L "cl_decline_first_notification" // L: Deny/dismiss the first notification (duels, item drops).
bind N "+voicerecord" // N: Voice chat input.
bind P "say_party" // P: Valve Casual party chat input.
bind Q "lastinv" // Q: Last used item.
bind U "say_team" // U: Team chat.
bind X "voice_menu_2" // X: Voice Menu 2
bind Y "say" // Y: Text chat.
bind Z "voice_menu_1" // Z: Voice Menu 1
bind "`" toggleconsole // `: Toggle console.
bind "," changeclass // ,: Change class.
bind "." changeteam // .: Change team.
bind tab "+info" // TAB: Scoreboard and net_graph.
bind [ "kill" // [: Kill bind. I kept pressing K on accident.
bind F3 "callvote" // F3: Vote menu (votekick, scramble, etc.).
bind F12 "demofix; sndfix; hudfix; fixgfx; cfgfix" // F12: Fix-all button. Will break some stuff too probably.
bind UPARROW "load_itempreset 0" // UPARROW: Load item preset 1.
bind LEFTARROW "load_itempreset 1" // LEFTARROW: Load item preset 2.
bind DOWNARROW "load_itempreset 2" // DOWNARROW: Load item preset 3.
bind RIGHTARROW "load_itempreset 3" // RIGHTARROW: Load item preset 4.
bind BACKSPACE "stfu" // BACKSPACE: Voice/text chat toggle. Plays a notification sound.
echo "*** AUTOEXEC: Loaded keybindings. ***"

// Demo settings.
echo "*** AUTOEXEC: Loading demo settings. ***"
demo_fov_override 90 // Sets the maximum FOV in a demo.
ds_dir demos // Save all demos in tf/demos/.
ds_enable 2 // Auto record all matches.
ds_min_streak 3 // Save killstreak timestamps of 3 or more.
ds_notify 0 // Do not notify that demos are being recorded.
ds_prefix "espi_" // Prefix all demo files with my username.
ds_sound 0 // Do not make a demo sound when recording.
viewmodel_fov_demo 75 // Sets the viewmodel fov for demos.
echo "*** AUTOEXEC: Loaded demo settings. ***"

// Gameplay settings.
echo "*** AUTOEXEC: Loading gameplay settings. ***"
cl_autoreload 1 // Enables auto-reload.
cl_autorezoom 1 // Enables automatic zoom after shooting with a Sniper Rifle.
cl_enable_text_chat 1 // Enables text chat.
hud_classautokill 0 // Do not suicide upon choosing a class.
hud_fastswitch 1 // Enables the fast weapon switcher.
hud_medicautocallers 1 // Enable auto-calling of heal targets.
hud_medicautocallersthreshold 75 // Heal targets auto-call medic at 75hp.
tf_colorblindassist 1 // Enables colorblind mode. Gives Jarate/Mad Milk indicators.
tf_medigun_autoheal 0 // Disables Medi-Gun autoheal, require holding down the button to heal.
tf_remember_activeweapon 1 // Remember the last active weapon between lives.
tf_remember_lastswitched 1 // Remember the last switched-to weapon between lives.
tf_simple_disguise_menu 1 // Enables the concise disguise menu.
tf_sniper_fullcharge_bell 1 // Play a notification sound when a Sniper Rifle is fully charged.
voice_enable 1 // Enables voice chat.
echo "*** AUTOEXEC: Loaded advanced gameplay settings. ***"

// Audio and hitsound settings.
echo "*** AUTOEXEC: Loading audio and hitsound settings. ***"
dsp_facingaway 0 // Disables DSP facing away effects.
dsp_room 0 // Disables DSP room effects.
dsp_slow_cpu 1 // Disables DSP.
dsp_spatial 0 // Disables DSP spacialization.
dsp_speaker 0 // Disables DSP speaker effects.
dsp_water 0 // Disables DSP water effects.
snd_mixahead 0.02 // Sets the snd_mixahead to the lowest possible value.
snd_musicvolume 0 // Disables in-game music.
tf_dingaling_lasthit_pitchmaxdmg 100 // Sets high damage killsound pitch.
tf_dingaling_lasthit_pitchmindmg 100 // Sets low damage killsound pitch.
tf_dingaling_lasthit_volume 1 // Sets the killsound volume.
tf_dingaling_pitchmaxdmg 100 // Sets high damage hitsound pitch.
tf_dingaling_pitchmindmg 100 // Sets low damage hitsound pitch.
tf_dingaling_volume 1 // Sets the hitsound volume.
tf_dingalingaling 1 // Enables hitsounds.
tf_dingalingaling_lasthit 1 // Enables last hit (kill) sounds.
tf_dingalingaling_repeat_delay 0 // Do not delay before repeating hitsounds.
echo "*** AUTOEXEC: Loaded audio and hitsound settings. ***"

// Graphics settings.
echo "*** AUTOEXEC: Loading graphics settings. ***"
engine_no_focus_sleep 0 // Disables the TF2 Engine from sleeping on Alt+Tab.
mat_monitorgamma 1.6 // Sets the maximum possible monitor brightness. Does not work on Xorg.
r_lightmap_bicubic 1 // Enable bi-cubic (high quality) lightmap sampling.
tf_hide_custom_decals 0 // Disable decals on signs, flair, etc.
echo "*** AUTOEXEC: Loaded graphics settings. ***"

// HUD and viewmodel settings.
echo "*** AUTOEXEC: Loading HUD settings. ***"
cl_hud_minmode 1 // Enables HUD minmode.
cl_hud_playerclass_use_playermodel 0 // Disables the 3D playermodel. Enabled only for Spy in spy.cfg.
cl_mvm_wave_status_visible_during_wave 1 // Display the MVM wave status.
cl_notifications_show_ingame 0 // Hide notification popups.
cl_showbackpackrarities 1 // Display backpack rarities.
con_enable 1 // Enables the console.
fov_desired 90 // Sets the maximum FOV.
hud_medichealtargetmarker 1 // Enables the heal target marker as Medic.
tf_hud_show_servertimelimit 1 // Show the current map time limit.
tf_hud_target_id_disable_floating_health 1 // Disables floating target IDs.
tf_scoreboard_mouse_mode 1 // Enables mouse input on the scoreboard.
tf_scoreboard_ping_as_text 1 // Show player ping as text.
tf_use_min_viewmodels 1 // Use minimized viewmodels.
viewmodel_fov 75 // Sets the viewmodel FOV. Any higher has weird bugs. Personal preference of mine.

// Damage number settings.
hud_combattext 1 // Enables floating damage numbers.
hud_combattext_batching 1 // Enables damage number batching.
hud_combattext_batching_window 2 // Batch all damage done within 2 seconds together.
hud_combattext_blue 0 // Sets the damage number blue RGB value.
hud_combattext_doesnt_block_overhead_text 1 // Do not block overhead text with damage numbers.
hud_combattext_green 255 // Sets the damage number green RGB value.
hud_combattext_red 255 // Sets the damage number red RGB value.

// Hide prompts and tips.
cl_ask_blacklist_opt_out 1 // Disable the server blocklist prompt.
cl_ask_favorite_opt_out 1 // Disable the server favorite prompt.
cl_disablehtmlmotd 1 // Disables HTML MOTDs.
tf_casual_welcome_hide 1 // Disable Casual mode welcome messages.
tf_coach_request_nevershowagain 1 // Disables coaching prompts.
tf_comp_welcome_hide 1 // Disable Competitive mode welcome messages.
tf_warpaint_explanation_viewed 1 // Hides the War Paint tutorials.
echo "*** AUTOEXEC: Loaded HUD and UI settings. ***"

// Mouse settings.
echo "*** AUTOEXEC: Loading mouse settings. ***"
m_filter 0 // Disables mouse filtering.
m_mousespeed 0 // Disables mouse acceleration.
m_pitch 0.022 // Sets the best default pitch.
m_rawinput 1 // Enables raw input.
m_yaw 0.022 // Sets the best default yaw.
sensitivity 0.75 // Sets my preferred sensitivity.
echo "*** AUTOEXEC: Loaded mouse settings. ***"

// Crouch jump script.
alias +cjump "+jump;+duck"
alias -cjump "-jump;-duck"

// Crosshair flashing script. Flashes between pink and green upon movement.
echo "*** AUTOEXEC: Loading flashing crosshair script. ***"
cl_crosshair_red 0 // Sets the crosshair red RGB value.
cl_crosshair_blue 0 // Sets the crosshair blue RGB value.
cl_crosshair_green 255 // Sets the crosshair green RGB value.
cl_crosshair_file "crosshair7" // +
cl_crosshair_scale 25 // Sets the crosshair size.
alias dotxhaircolor "dotxhaircolorb"
alias dotxhaircolorb "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0;alias dotxhaircolor dotxhaircolorr"
alias dotxhaircolorr "cl_crosshair_blue 255; cl_crosshair_green 0; cl_crosshair_red 255;alias dotxhaircolor dotxhaircolorb"
echo "*** AUTOEXEC: Loaded flashing crosshair script. ***"

// Fix-all script. Fixes issues in this awful game. Thanks Angie!
echo "*** AUTOEXEC: Loading fix-all scripts. ***"
alias cfgfix "cl_reload_localization_files; exec autoexec; echo *** SETTINGS RESTORED ***"
alias demofix "record fix; stop; echo *** DEMO RECORDING FIXED ***"
alias fixgfx "r_flushlod; mat_reloadallmaterials; mat_reloadtextures; echo *** GRAPHICS FIXED ***"
alias hudfix "hud_reloadscheme; echo *** HUD FIXED ***"
alias sndfix "snd_restart; echo *** SOUND FIXED ***"
echo "*** AUTOEXEC: Loaded fix-all scripts. ***"

// net_graph scoreboard script.
echo "*** AUTOEXEC: Loading net_graph scoreboard script. ***"
alias +info "net_graph 1; +showscores; cl_showpos 1"
alias -info "net_graph 0; -showscores; cl_showpos 0"
echo "*** AUTOEXEC: Loaded net_graph scoreboard script. ***"

// Mute toggle button script.
echo "*** AUTOEXEC: Loading mute button script. ***"
alias stfu stfu1
alias stfu1 "hud_saytext_time 0; voice_modenable 0; voice_scale 0;  echo *** CHAT OFF ***; playgamesound spy.dominationscout07; alias stfu stfu2"
alias stfu2 "hud_saytext_time 12; voice_modenable 1; voice_scale 1; echo *** CHAT ON ***; playgamesound scout.specialcompleted12; alias stfu stfu1"
echo "*** AUTOEXEC: Loaded mute button script. ***"

cl_phys_props_max 0
r_propsmaxdist 1
