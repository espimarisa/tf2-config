// espimarisa's autoexec
// mastercomfig takes care of the majority of things
// launch opts (linux): -novid -nojoy -nosteamcontroller -nohltv -particles 1 -no_texture_stream -enablefakeip -condebug +exec overrides/preload.cfg;

// Keybinding settings.
echo "*** AUTOEXEC: Loading keybindings. ***"
bind 1 "slot1; next_map_vote 0" // 1: Weapon slot 1. Also votes map #1 in casual.
bind 2 "slot2; next_map_vote 1" // 2: Weapon slot 2. Also votes map #2 in casual.
bind 3 "slot3; next_map_vote 2" // 3: Reset weapon slot 2 and votes #3 in casual.
bind W "+mf; xhairc" // W: Mastercomfig null-movement, flash crosshair, and move forward.
bind A "+ml; xhairc" // A: Mastercomfig null-movement, flash crosshair, and move left.
bind S "+mb; xhairc" // S: Mastercomfig null-movement, flash crosshair, and move backward.
bind D "+mr; xhairc" // D: Mastercomfig null-movement, flash crosshair, and move right.
bind H "+use_action_slot_item" // H: Action item slot.
bind K "cl_trigger_first_notification" // K: Accept first HUD notification.
bind L "cl_decline_first_notification" // L: Decline first HUD notification.
bind N "+voicerecord" // N: Voice input key.
bind P "say_party" // P: Casual party chat.
bind tab "+info" // TAB: Scoreboard + net_graph.
bind [ "kill" // [: Kill bind.
bind UPARROW "load_itempreset 0" // UP ARROW: Loadout preset 1.
bind LEFTARROW "load_itempreset 1" // LEFT ARROW: Loadout preset 2.
bind DOWNARROW "load_itempreset 2" // DOWN ARROW: Loadout preset 3.
bind RIGHTARROW "load_itempreset 3" // RIGHT ARROW: Loadout preset 4.
bind F6 "record fix; stop; snd_restart; hud_reloadscheme" // F6: Demo fix button.
bind F10 "say displace :  lol u are a bug in jar that i shake"
bind F11 "say CONFORM NOW --> WWW.CAREERS.WALMART.COM"
echo "*** AUTOEXEC: Loaded keybindings. ***"

// Demo settings.
echo "*** AUTOEXEC: Loading demo settings. ***"
demo_fov_override 90 // Configures demo FOVs.
ds_prefix "espimarisa_" // Configures demo prefix.
ds_dir demos // Output demos to tf/demos.
ds_enable 2 // Enables recording demos.
ds_min_streak 3 // Timestamp killstreaks 3 or above.
ds_notify 0 // Notify when a demo starts in the console.
ds_sound 0 // Disable the annoying demo sound.
viewmodel_fov_demo 75 // Configures demo viewmodel FOV.
echo "*** AUTOEXEC: Loaded demo settings. ***"

// Gameplay settings.
echo "*** AUTOEXEC: Loading gameplay settings. ***"
cl_autoreload 1 // Enables autoreload.
cl_autorezoom 1 // Automatically re-scope upon firing as Sniper.
cl_enable_text_chat 1 // Enables text communication.
hud_classautokill 0 // Do not suicide immediately upon changing classes.
hud_fastswitch 1 // Enables fast weapon switches.
hud_medicautocallers 1 // Enables teammate auto-calling for medic.
hud_medicautocallersthreshold 75 // Configures the teammate auto-call threshold.
tf_colorblindassist 1 // Enables colorblind mode; higher visability Jarate and Milk indicators.
tf_medigun_autoheal 1 // Do not require always holding M1 to heal a target.
tf_remember_activeweapon 1 // Remember the last active weapon between lives.
tf_remember_lastswitched 1 // Remember the last switched-to weapon between lives.
tf_simple_disguise_menu 1 // Enables the consise disguise menu for Spy (D -> 1, 2, 3 -> 1, 2, 3).
tf_sniper_fullcharge_bell 1 // Enables playing a bell sound upon fully charging a Sniper Rifle.
voice_enable 1 // Enables voice communication.
echo "*** AUTOEXEC: Loaded advanced gameplay settings. ***"

// Audio and hitsound settings.
echo "*** AUTOEXEC: Loading audio and hitsound settings. ***"
snd_musicvolume 0 // Mutes music, ow my ears!
tf_dingaling_lasthit_pitchmaxdmg 100 // Killsound pitch for attacks that deal <=150 damage. (1 to 255).
tf_dingaling_lasthit_pitchmindmg 100 // Killsound pitch for attacks that deal <=10 damage. (1 to 255).
tf_dingaling_lasthit_volume 1 // Killsound volume percentage.
tf_dingaling_pitchmaxdmg 100 // Hitsound pitch for attacks that deal <=150 damage. (1 to 255).
tf_dingaling_pitchmindmg 100 // Hitsound pitch for attacks that deal <=10 damage. (1 to 255).
tf_dingaling_volume 1 // Hitsound volume percentage.
tf_dingalingaling 1 // Enables hitsounds.
tf_dingalingaling_lasthit 1 // Enables killsounds.
tf_dingalingaling_repeat_delay 0 // Do not limit how often hitsounds can play.
volume 0.06 // Sets volume.
echo "*** AUTOEXEC: Loaded audio and hitsound settings. ***"

// Graphics settings.
echo "*** AUTOEXEC: Loading graphics settings. ***"
cl_phys_props_max 0 // Disables gibs. NOTE: Mastercomfig does this, but this needs to be done for Vulkan.
engine_no_focus_sleep 0 // Disables source engine sleeping upon alt tabbing.
mat_monitorgamma 1.6 // Configures in-game gamma. (1.6 to 3.0, lower is brighter).
r_propsmaxdist 1 // Disables gibs. NOTE: Mastercomfig does this, but this needs to be done for Vulkan.
r_rimlight 1 // Enables rimlighting.
tf_hide_custom_decals 1 // Disables custom decals (signs, sprays, etc).
echo "*** AUTOEXEC: Loaded graphics settings. ***"

// HUD settings.
echo "*** AUTOEXEC: Loading HUD settings. ***"
cl_ask_blacklist_opt_out 1 // Do not prompt to blacklist servers.
cl_ask_favorite_opt_out 1 // Do not prompt to favorite servers.
cl_disablehtmlmotd 1 // Disables HTML MOTDs.
cl_hud_minmode 1 // Enables HUD minmode.
cl_hud_playerclass_use_playermodel 0 // Disables the 3D playermodel. NOTE: Set to 1 in spy.cfg; Spy needs it.
cl_mvm_wave_status_visible_during_wave 1 // Always show remaining robots in a wave in MVM.
cl_notifications_show_ingame 0 // Disables notifications from popping up mid-game.
cl_showbackpackrarities 1 // Enables item rarity color outlines in the backpack.
con_enable 1 // Enables the developer console.
con_filter_enable 1 // Enables the console filter.
con_filter_text_out "caption" // Disable annoying "No caption" spam.
fov_desired 90 // Maxes FOV.
hud_combattext 1 // Enables damage numbers.
hud_combattext_batching 1 // Enables damage number batching.
hud_combattext_batching_window 2 // Batch all damage done within 2 seconds.
hud_combattext_blue 0 // Configures damage number RG(B) value. 255 255 0 is yellow.
hud_combattext_doesnt_block_overhead_text 1 // Do not hide other indicators with damage text.
hud_combattext_green 255 // Configures damage number R(G)B value. 255 255 0 is yellow.
hud_combattext_red 255 // Configures damage number (R)GB value. 255 255 0 is yellow.
hud_medichealtargetmarker 1 // Shows a marker on the teammate currently being healed.
hud_saytext_time 5 // Configures the number of seconds before hiding text chat messages.
tf_casual_welcome_hide 1 // Hides the "Welcome to Casual!" prompts.
tf_coach_request_nevershowagain 1 // Hides coaching requests.
tf_contract_progress_show 0 // Hides contract progress.
tf_hud_show_servertimelimit 1 // Shows the server time limit.
tf_hud_target_id_disable_floating_health 1 // Disables floating health indicators and moves them to the middle target ID.
tf_scoreboard_mouse_mode 1 // Enables mouse input on the scoreboard.
tf_scoreboard_ping_as_text 1 // Shows ping as numerical values.
tf_use_min_viewmodels 1 // Enables minimal viewmodels.
tf_warpaint_explanation_viewed 1 // Disables war paint tutorial explanations.
viewmodel_fov 75 // Sets viewmodel FOV.
echo "*** AUTOEXEC: Loaded HUD and UI settings. ***"

// Mouse settings.
echo "*** AUTOEXEC: Loading mouse settings. ***"
m_filter 0 // Disables mouse filtering.
m_mousespeed 0 // Disables Windows mouse acceleration (lmao install Gentoo).
m_pitch 0.022 // Resets default pitch.
m_rawinput 1 // Enables raw input.
m_yaw 0.022 // Resets default yaw.
sensitivity 1.2 // Sets my preferred sensitivity.
echo "*** AUTOEXEC: Loaded mouse settings. ***"

// net_graph scoreboard script.
echo "*** AUTOEXEC: Loading net_graph scoreboard script. ***"
alias +info "net_graph 2; +showscores; cl_showpos 1" // Show scoreboard and net_graph.
alias -info "net_graph 0; -showscores; cl_showpos 0" // Hide scoreboard and net_graph.
echo "*** AUTOEXEC: Loaded net_graph scoreboard script. ***"

// Flashing crosshair script; flashes the crosshair upon horizontal movement.
echo "*** AUTOEXEC: Loading flashing crosshair script. ***"
cl_crosshair_red 0 // Configures default crosshair color (R)GB value. 0 255 0 is green.
cl_crosshair_green 255 // Configures default crosshair color R(G)B value. 0 255 0 is green.
cl_crosshair_blue 0 // Configures default crosshair color RG(B) value. 0 255 0 is green.
cl_crosshair_file "crosshair7" // Sets the built-in crosshair to be a plain borderless cross.
cl_crosshair_scale 50 // Configures the default crosshair scale.
alias xhairc "xhaircr" // Crosshair flash script.
alias xhaircb "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0; alias xhairc xhaircr" // Flash to green.
alias xhaircr "cl_crosshair_blue 255; cl_crosshair_green 0; cl_crosshair_red 255; alias xhairc xhaircb" // Flash to pink.
echo "*** AUTOEXEC: Loaded flashing crosshair script. ***"
