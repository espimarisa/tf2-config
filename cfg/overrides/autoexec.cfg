// Binds
bind 1 "slot1; next_map_vote 0"
bind 2 "slot2; next_map_vote 1"
bind 3 "slot3; next_map_vote 2"
bind 8 "say displace :  lol u are a bug in jar that i shake"
bind 9 "say CONFORM NOW --> WWW.CAREERS.WALMART.COM"
bind [ "kill"
bind DEL "record fix;stop;snd_restart;hud_reloadscheme"
bind DOWNARROW "load_itempreset 2;"
bind f "+inspect"
bind g "+voicerecord"
bind h "+use_action_slot_item"
