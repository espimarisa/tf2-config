// OBS_VKCAPTURE=1 gamemoderun obs-gamecapture %command% -fullscreen -w 1920 -h 1080 -novid -nojoy -nosteamcontroller -no_texture_stream -nohltv -particles 1 -condebug -console +exec preload.cfg

// Keybinding settings.
echo "*** AUTOEXEC: Loading keybindings. ***"
bind W "+mf; dotxhaircolor"
bind A "+ml; dotxhaircolor"
bind S "+mb; dotxhaircolor"
bind D "+mr; dotxhaircolor"
bind 1 "slot1; next_map_vote 0"
bind 2 "slot2; next_map_vote 1"
bind 3 "slot3; next_map_vote 2"
bind H "+use_action_slot_item"
bind K "cl_trigger_first_notification"
bind L "cl_decline_first_notification"
bind N "+voicerecord"
bind P "say_party"
bind tab "+info"
bind [ "kill"
bind F3 "callvote"
bind F12 "demofix; sndfix; hudfix; fixgfx; cfgfix"
bind UPARROW "load_itempreset 0"
bind LEFTARROW "load_itempreset 1"
bind DOWNARROW "load_itempreset 2"
bind RIGHTARROW "load_itempreset 3"
bind BACKSPACE "stfu"
echo "*** AUTOEXEC: Loaded keybindings. ***"

// Demo settings.
echo "*** AUTOEXEC: Loading demo settings. ***"
demo_fov_override 90
ds_dir demos
ds_enable 2
ds_min_streak 3
ds_notify 0
ds_prefix "espimarisa_"
ds_sound 0
viewmodel_fov_demo 75
echo "*** AUTOEXEC: Loaded demo settings. ***"

// Gameplay settings.
echo "*** AUTOEXEC: Loading gameplay settings. ***"
cl_autoreload 1
cl_autorezoom 1
cl_enable_text_chat 1
hud_classautokill 0
hud_fastswitch 1
hud_medicautocallers 1
hud_medicautocallersthreshold 75
tf_colorblindassist 1
tf_medigun_autoheal 1
tf_remember_activeweapon 1
tf_remember_lastswitched 1
tf_simple_disguise_menu 1
tf_sniper_fullcharge_bell 1
voice_enable 1
echo "*** AUTOEXEC: Loaded advanced gameplay settings. ***"

// Audio and hitsound settings.
echo "*** AUTOEXEC: Loading audio and hitsound settings. ***"
snd_musicvolume 0
tf_dingaling_lasthit_pitchmaxdmg 100
tf_dingaling_lasthit_pitchmindmg 100
tf_dingaling_lasthit_volume 1
tf_dingaling_pitchmaxdmg 100
tf_dingaling_pitchmindmg 100
tf_dingaling_volume 1
tf_dingalingaling 1
tf_dingalingaling_lasthit 1
tf_dingalingaling_repeat_delay 0
echo "*** AUTOEXEC: Loaded audio and hitsound settings. ***"

// Graphics settings.
echo "*** AUTOEXEC: Loading graphics settings. ***"
cl_phys_props_max 0
engine_no_focus_sleep 0
mat_monitorgamma 1.6
r_propsmaxdist 1
r_lightmap_bicubic 1
tf_hide_custom_decals 1
echo "*** AUTOEXEC: Loaded graphics settings. ***"

echo "*** AUTOEXEC: Loading HUD settings. ***"
// HUD and viewmodel settings.
cl_hud_minmode 1
cl_hud_playerclass_use_playermodel 0
cl_mvm_wave_status_visible_during_wave 1
cl_notifications_show_ingame 0
cl_showbackpackrarities 1
con_enable 1
fov_desired 90
hud_medichealtargetmarker 1
tf_hud_show_servertimelimit 1
tf_hud_target_id_disable_floating_health 1
tf_scoreboard_mouse_mode 1
tf_scoreboard_ping_as_text 1
tf_use_min_viewmodels 1
viewmodel_fov 75

// Damage number settings.
hud_combattext 1
hud_combattext_batching 1
hud_combattext_batching_window 2
hud_combattext_blue 0
hud_combattext_doesnt_block_overhead_text 1
hud_combattext_green 255
hud_combattext_red 255

// Hide prompts and tips.
cl_ask_blacklist_opt_out 1
cl_ask_favorite_opt_out 1
cl_disablehtmlmotd 1
tf_casual_welcome_hide 1
tf_coach_request_nevershowagain 1
tf_contract_progress_show 0
tf_warpaint_explanation_viewed 1
echo "*** AUTOEXEC: Loaded HUD and UI settings. ***"

// Mouse settings.
echo "*** AUTOEXEC: Loading mouse settings. ***"
m_filter 0
m_mousespeed 0
m_pitch 0.022
m_rawinput 1
m_yaw 0.022
sensitivity 0.75
echo "*** AUTOEXEC: Loaded mouse settings. ***"

// Crosshair flashing script. Flashes between pink and green upon movement.
echo "*** AUTOEXEC: Loading flashing crosshair script. ***"
cl_crosshair_red 0
cl_crosshair_blue 0
cl_crosshair_green 255
cl_crosshair_file "crosshair7"
cl_crosshair_scale 25
alias dotxhaircolor "dotxhaircolorb"
alias dotxhaircolorb "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0;alias dotxhaircolor dotxhaircolorr"
alias dotxhaircolorr "cl_crosshair_blue 255; cl_crosshair_green 0; cl_crosshair_red 255;alias dotxhaircolor dotxhaircolorb"
echo "*** AUTOEXEC: Loaded flashing crosshair script. ***"

// Fix-all script. Fixes issues in this awful game. Thanks Angie!
echo "*** AUTOEXEC: Loading fix-all scripts. ***"
alias cfgfix "cl_reload_localization_files; exec autoexec; echo *** SETTINGS RESTORED ***"
alias demofix "record fix; stop; echo *** DEMO RECORDING FIXED ***"
alias fixgfx "r_flushlod; mat_reloadallmaterials; mat_reloadtextures; echo *** GRAPHICS FIXED ***"
alias hudfix "hud_reloadscheme; echo *** HUD FIXED ***"
alias sndfix "snd_restart; echo *** SOUND FIXED ***"
echo "*** AUTOEXEC: Loaded fix-all scripts. ***"

// net_graph scoreboard script.
echo "*** AUTOEXEC: Loading net_graph scoreboard script. ***"
alias +info "net_graph 1; +showscores; cl_showpos 1"
alias -info "net_graph 0; -showscores; cl_showpos 0"
echo "*** AUTOEXEC: Loaded net_graph scoreboard script. ***"

// Mute toggle button script.
echo "*** AUTOEXEC: Loading mute button script. ***"
alias stfu stfu1
alias stfu1 "hud_saytext_time 0; voice_modenable 0; voice_scale 0;  echo *** CHAT OFF ***; playgamesound spy.dominationscout07; alias stfu stfu2"
alias stfu2 "hud_saytext_time 12; voice_modenable 1; voice_scale 1; echo *** CHAT ON ***; playgamesound scout.specialcompleted12; alias stfu stfu1"
echo "*** AUTOEXEC: Loaded mute button script. ***"
