exec overrides/reset.cfg

echo "*** OVERRIDES: Selected Spy, running overrides. ***"

cl_hud_playerclass_use_playermodel 1 // Enables the 3D playermodel.
bind MOUSE3 "disguise 1 -1" // MOUSE3/WHEEL CLICK: Enemy scout disguise.
bind MOUSE4 "disguise 8 -2" // MOUSE4/FORWARD: Undisguise bind.
bind MOUSE5 "disguise 1 -2" // MOUSE5/BACK: Friendly scout disguise.
bind 2 "+sapper" // 2: Constantly sap while holding.
bind T "disguiseteam" // T: Swaps the team to disguise as.
bind V "lastdisguise" // V: Last disguise/disguise weapon switch.
bind B "checkmedigun" // B: Medi-Gun checker Press once, wait a second, and then once again.
alias "+sapper" "slot2;+attack" // Constantly sap while holding a button.
alias "-sapper" "lastinv;-attack" // Constantly sap while holding a button.
alias checkmedigun "slot2; disguise 5 -1"

echo "*** OVERRIDES: Finished running. ***"
