exec reset.cfg

echo "*** OVERRIDES: Selected Spy. ***"

cl_hud_playerclass_use_playermodel 1 // Enable 3D playermodel. Helps check disguise/weapons ran.
bind MOUSE3 "enemyscout" // MOUSE3: Enemy Scout disguise.
bind MOUSE4 "undisguise" // MOUSE4: Undisguises.
bind MOUSE5 "friendlyscout" // MOUSE5: Friendly Scout disguise.
bind 2 "+sapper" // 2: Hold down to repeatedly sap.
bind 5 "checkmedigun" // 5: Hold (press twice) to check what Medi-Gun the enemy Medic is running.
bind T "disguiseteam" // T: Toggles the Disguise Kit team.
bind V "lastdisguise" // V: Previous disguise.

// Sapper script. When held down repeatedly saps.
alias "+sapper" "slot2;+attack"
alias "-sapper" "lastinv;-attack"

// Disguise binds.
alias enemyscout "disguise 1 -1" // Enemy Scout disguise.
alias friendlyscout "disguise 1 -2" // Friendly Scout disguise.
alias undisguise "disguise 8 -2" // Undisguises (friendly Spy disguise).
alias checkmedigun "slot2; disguise 5 -1" // Disguises as a medic holding his Medi-Gun.
