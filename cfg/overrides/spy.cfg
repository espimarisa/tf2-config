exec reset.cfg

echo "*** OVERRIDES: Selected Spy. ***"

// MOUSE3/WHEEL CLICK: Enemy scout disguise.
// MOUSE4/FORWARD: Undisguise bind.
// MOUSE5/BACK: Friendly scout disguise.

cl_hud_playerclass_use_playermodel 1 
bind MOUSE3 "disguise 1 -1" 
bind MOUSE4 "disguise 8 -2" 
bind MOUSE5 "disguise 1 -2" 
bind 2 "+sapper" 
bind T "disguiseteam" 
bind V "lastdisguise" 
bind B "checkmedigun" 
alias "+sapper" "slot2;+attack"
alias "-sapper" "lastinv;-attack" 
alias checkmedigun "slot2; disguise 5 -1"
