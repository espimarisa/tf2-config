exec overrides/reset.cfg

echo "*** OVERRIDES: Selected Engineer, running class-specific overrides. ***"

bind MOUSE3 "destroy 2 0; build 2 0" // MIDDLE-CLICK: Build/destroy sentry.
bind MOUSE4 "destroy 1 1; build 1 1" // MOUSE4/FORWARD: Build/destroy teleporter entrance.
bind MOUSE5 "destroy 1 0; build 1 0" // MOUSE5/BACK: Build/destroy teleporter exit.
bind v "destroy 0 0; build 0 0" // V: Build/destroy dispenser.

echo "*** OVERRIDES: Finished running. ***"
