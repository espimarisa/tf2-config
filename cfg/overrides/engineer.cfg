exec reset.cfg

// Building/destruction binds.
// Wheel click is Sentry, v is dispenser, mouse buttons are teleporters.

bind MOUSE3 "destroy 2 0; build 2 0"
bind MOUSE4 "destroy 1 1; build 1 1;"
bind MOUSE5 "destroy 1 0; build 1 0;"
bind v "destroy 0 0; build 0 0"
