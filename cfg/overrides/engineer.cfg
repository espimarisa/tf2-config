exec reset.cfg
echo "*** OVERRIDES: Selected Engineer. ***"
// MOUSE3: Sentry build/destroy button.
// MOUSE4: Teleporter entrance build/destroy button.
// MOUSE5: Teleporter exit build/destroy button.
// v: Dispenser build/destroy button.
bind MOUSE3 "destroy 2 0; build 2 0"
