cl_hud_playerclass_use_playermodel 0
bind 1 "slot1; next_map_vote 0"
bind 2 "slot2; next_map_vote 1"
bind 3 "slot3; next_map_vote 2"
bind 4 "slot4"
bind 5 "slot5"
bind MOUSE1 +attack
bind MOUSE2 +attack2
bind MOUSE3 +attack3
bind UPARROW "load_itempreset 0"
bind LEFTARROW "load_itempreset 1"
bind DOWNARROW "load_itempreset 2"
bind RIGHTARROW "load_itempreset 3"
unbind MOUSE4
unbind MOUSE5
unbind B
unbind T
unbind V
bind W "+mf; dotxhaircolor"
bind A "+ml; dotxhaircolor"
bind S "+mb; dotxhaircolor"
bind D "+mr; dotxhaircolor"
// Crosshair flashing script. Flashes between pink and green upon movement.
echo "*** AUTOEXEC: Loading flashing crosshair script. ***"
cl_crosshair_red 0
cl_crosshair_blue 0
cl_crosshair_green 255
cl_crosshair_file "crosshair7"
cl_crosshair_scale 25
alias dotxhaircolor "dotxhaircolorb"
alias dotxhaircolorb "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0;alias dotxhaircolor dotxhaircolorr"
alias dotxhaircolorr "cl_crosshair_blue 255; cl_crosshair_green 0; cl_crosshair_red 255;alias dotxhaircolor dotxhaircolorb"
echo "*** AUTOEXEC: Loaded flashing crosshair script. ***"
